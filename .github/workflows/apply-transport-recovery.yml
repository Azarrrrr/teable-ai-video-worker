name: Apply tested transport recovery
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: video-worker-maintenance
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply guarded transport patch
        run: node apply-transport-recovery.mjs
      - name: Verify request recovery and subtitles
        run: node --check worker.mjs && node check-transport.mjs && node check-input-subtitles.mjs && node check-subtitles.mjs
      - name: Commit verified worker changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Apply verified upload recovery and preview checkpoints'
            git push origin HEAD:main
          fi
